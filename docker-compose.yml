version: "3.8"

services:
  localstack-lab:
    image: localstack/localstack:latest
    container_name: localstack-lab
    ports:
      - "4566:4566"   # Gateway principal
    environment:
      - SERVICES=iam,s3,secretsmanager,lambda,sqs,sns,cloudwatch,logs
      - DEBUG=1
    volumes:
      - "./localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  postgres:
    image: postgres:16
    container_name: postgres-lab
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=notesdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: